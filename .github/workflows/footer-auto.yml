name: Add DinoNor footer
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update footer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<footer><span>© 2026 SYKO KYAN</span><span>THE UNIVERSAL RAPPER / SRI LANKA</span></footer>'
          new='<footer><span>© 2026 SYKO KYAN</span><span>THE UNIVERSAL RAPPER / SRI LANKA</span><span>BUILT BY NOVA / DINONOR</span></footer>'
          if old not in s:
              raise SystemExit('Footer pattern not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/footer-update.yml .github/workflows/footer-auto.yml || true
          git commit -m 'Add Nova DinoNor credit to footer'
          git push
